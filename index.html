<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      (function () {
        var theme = 'system';
        try {
          var raw = localStorage.getItem('bachata-settings-v1');
          var saved = raw ? JSON.parse(raw) : null;
          if (saved && saved.version === 1) {
            if (saved.theme === 'light' || saved.theme === 'dark') theme = saved.theme;
          } else if (
            localStorage.getItem('bachata-state-v2') !== null ||
            localStorage.getItem('bachata-progress-v1') !== null
          ) {
            theme = 'dark';
          }
        } catch (error) {
          // Storage unavailable or corrupt: fall back to the system theme; the app store handles the rest.
        }
        if (theme === 'system') {
          theme =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f0a18" />
    <meta name="description" content="Bachata class roadmap with checklists and progress" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Roadmap" />
    <link rel="icon" href="%BASE_URL%icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon.svg" />
    <title>Bachata Roadmap</title>
  </head>
  <body>
    <noscript>
      <div class="ios-hint">
        JavaScript is disabled. Open the file in Safari, not in the Files preview.
      </div>
    </noscript>
    <div class="ios-hint" id="iosHint">
      PWA works only via the HTTPS link (not from Files).<br />
      Open <b>andreyb622.github.io/bachata-roadmap</b> in Safari →
      <b>Share → Add to Home Screen</b>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
